version: "3.8"

services:
  postgres:
    image: postgres:latest
    container_name: postgres_dbtest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - containers_test:/var/lib/postgresql

volumes:
  containers_test:
